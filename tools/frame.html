<!doctype html>
<!-- Dev helper: shows the app in an iPhone-sized frame (headless Chrome cannot open windows narrower than 500px).
     ?h=660 sets the frame height (Safari with its toolbars is about 660 tall; installed it is about 760 to 844). -->
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } iframe { border: 0; width: 390px; display: block; }</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search); const f = document.getElementById('f');
f.style.height = (q.get('h') || 844) + 'px'; q.delete('h');
f.src = '../public/index.html?' + q.toString();
</script>
